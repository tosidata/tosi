url: https://tosidata.github.io/tosi/

template:
  bootstrap: 5

examples:
  run: false

articles:
  - title: Get started
    contents:
      - starts_with("articles/getting-started")

reference:
  - title: Find and retrieve tables
    contents:
      - remote_frontends
      - tosi_help
      - tosi_options
      - tosi_cache_clear
  - title: Inspect table metadata and structure
    contents:
      - tosi_metadata
  - title: Work with tables and provenance
    contents:
      - is_tosi_table
      - provenance
  - title: Response objects
    contents:
      - TosiHelp
      - TosiMetadata
      - TosiSchema
      - TosiProvenance
      - TosiSourceReference
      - TosiSourceDocument
      - TosiIndexDocument
  - title: Identifiers and frequency codes
    contents:
      - id-vectors
      - object_path
      - new_frequency_code
  - title: Search indexing
    contents:
      - tosi_index_document
